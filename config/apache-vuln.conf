<VirtualHost *:80>
    ServerAdmin admin@vulnlab.corp
    DocumentRoot /var/www/html

    # 漏洞：伺服器版本資訊洩漏
    ServerSignature On

    # 漏洞：啟用 server-status 且無存取限制
    <Location /server-status>
        SetHandler server-status
        # 應限制 IP，但故意開放
        Require all granted
    </Location>

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        # 漏洞：啟用目錄列表 (Indexes)
        AllowOverride All
        Require all granted
    </Directory>

    # 漏洞：.git 目錄可被存取
    <Directory /var/www/html/.git>
        Require all granted
    </Directory>

    # 漏洞：備份目錄可被存取
    <Directory /var/www/html/backup>
        Options Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # 漏洞：未設定安全性標頭
    # 缺少 X-Frame-Options, X-Content-Type-Options, CSP 等
</VirtualHost>
