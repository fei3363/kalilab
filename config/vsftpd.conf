# VulnLab FTP 配置
# 漏洞：啟用匿名登入 + 本地帳號明文傳輸

listen=YES
listen_ipv6=NO

# 允許匿名登入（風險）
anonymous_enable=YES
anon_root=/var/ftp

# 允許本地帳號登入
local_enable=YES
write_enable=YES

# 不使用 TLS（明文傳輸密碼）
ssl_enable=NO

# 顯示目錄清單
dirmessage_enable=YES
use_localtime=YES

# 日誌
xferlog_enable=YES
connect_from_port_20=YES

# PAM 認證
pam_service_name=vsftpd

# 允許 chroot
seccomp_sandbox=NO
